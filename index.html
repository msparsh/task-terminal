<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title></title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000000;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Menlo', 'Monaco', 'Cascadia Code', 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.5;
      overflow: hidden;
    }

    #terminal {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 16px;
      overflow-y: auto;
      color: #c0c0c0;
      background: #000000;
    }

    #output {
      flex: 1;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: none;
      -webkit-user-select: none;
    }

    /* no rounded corners, no borders, clean */
    .input-line {
      display: flex;
      align-items: center;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid #222;
    }

    .prompt {
      color: #00cc44;
      font-weight: normal;
      margin-right: 12px;
      white-space: pre;
    }

    #cmd-input {
      background: transparent;
      border: none;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      flex: 1;
      outline: none;
      padding: 4px 0;
    }

    .response-text {
      color: #dadada;
      margin: 4px 0 8px 0;
      white-space: pre-wrap;
    }

    .user-cmd-line {
      color: #ffffff;
      margin: 8px 0 2px 0;
    }

    ::-webkit-scrollbar {
      width: 8px;
      background: #111;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
    }

    .c-red {
      color: #e06c75;
    }

    .c-purple {
      color: #c678dd;
    }

    .c-green {
      color: #98c379;
    }

    .c-blue {
      color: #61afef;
    }

    .c-yellow {
      color: #e5c07b;
    }

    .c-dim {
      color: #5c6370;
    }

    .board-header {
      text-decoration: underline;
    }

    .drag-bar {
      -webkit-app-region: drag;

      height: 32px;
      width: 100%;

      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>

<body>
  <header class="drag-bar"></header>
  <div id="terminal">
    <div id="output"></div>
    <div class="input-line">
      <span class="prompt">$</span>
      <input type="text" id="cmd-input" spellcheck="false" autofocus autocomplete="off">
    </div>
  </div>

  <script>
    // --------------------------------------------------------------
    // TASKBOOK ENGINE – plain storage, no emoji, no extra styling
    // --------------------------------------------------------------
    class Core {
      constructor() {
        this._load();
      }

      _load() {
        const data = window.api.loadDataSync();

        this.items = data.items || {};
        this.archive = data.archive || {};

        if (Object.keys(this.items).length === 0) this._nextId = 1;
        else this._nextId = Math.max(...Object.keys(this.items).map(Number), 0) + 1;
      }

      _save() {
        window.api.saveDataSync({
          items: this.items,
          archive: this.archive
        });
      }

      _generateId() {
        return this._nextId++;
      }

      _nowMeta() {
        const now = new Date();
        return { timestamp: now.getTime(), dateString: now.toDateString() };
      }

      _parseOptions(args) {
        let boards = [];
        let priority = 1;
        let dueDate = null;
        let descriptionWords = [];
        for (let t of args) {
          if (t.startsWith('@') && t.length > 1) boards.push(t);
          else if (/^p:[123]$/i.test(t)) priority = parseInt(t[2], 10);
          else if (/^due:\d{2}-\d{2}-\d{4}$/i.test(t)) dueDate = t.substring(4);
          else descriptionWords.push(t);
        }
        if (boards.length === 0) boards.push('inbox');
        let description = descriptionWords.join(' ').trim();
        return { boards, priority, description, dueDate };
      }

      createTask(args) {
        if (!args.length) return { error: true, msg: 'Error: task description required' };
        const { boards, priority, dueDate, description } = this._parseOptions(args);
        if (!description) return { error: true, msg: 'Error: empty description' };
        const id = this._generateId();
        const { timestamp, dateString } = this._nowMeta();
        this.items[id] = {
          id, description, boards, priority, isStarred: false,
          isComplete: false, inProgress: false, _isTask: true,
          _date: dateString, _timestamp: timestamp, _dueDate: dueDate
        };
        this._save();
        return { success: true, msg: `Created task [${id}]: ${description}`, id };
      }

      createNote(args) {
        if (!args.length) return { error: true, msg: 'Error: note description required' };
        const { boards, description } = this._parseOptions(args);
        if (!description) return { error: true, msg: 'Error: empty description' };
        const id = this._generateId();
        const { timestamp, dateString } = this._nowMeta();
        this.items[id] = {
          id, description, boards, isStarred: false, _isTask: false,
          _date: dateString, _timestamp: timestamp
        };
        this._save();
        return { success: true, msg: `Created note [${id}]: ${description}` };
      }

      _validateIds(ids, source = 'items') {
        const pool = source === 'items' ? this.items : this.archive;
        let valid = [];
        for (let raw of ids) {
          let num = Number(raw);
          if (isNaN(num) || !pool[num]) return { error: true, msg: `Invalid ID: ${raw} not found` };
          valid.push(num);
        }
        return { valid };
      }

      checkTasks(idsRaw) {
        let ids = idsRaw.map(String);
        let v = this._validateIds(ids);
        if (v.error) return v;
        let checked = [], unchecked = [];
        for (let id of v.valid) {
          let it = this.items[id];
          if (!it._isTask) return { error: true, msg: `Item ${id} is a note, cannot check/uncheck` };
          it.isComplete = !it.isComplete;
          if (it.isComplete) it.inProgress = false;
          (it.isComplete ? checked : unchecked).push(id);
        }
        this._save();
        let msg = '';
        if (checked.length) msg += `Checked (complete): ${checked.join(', ')}. `;
        if (unchecked.length) msg += `Unchecked (pending): ${unchecked.join(', ')}.`;
        return { success: true, msg: msg || 'No tasks updated' };
      }

      beginTasks(idsRaw) {
        let ids = idsRaw.map(String);
        let v = this._validateIds(ids);
        if (v.error) return v;
        let started = [], paused = [];
        for (let id of v.valid) {
          let it = this.items[id];
          if (!it._isTask) return { error: true, msg: `Item ${id} is a note, cannot start/pause` };
          if (it.isComplete) return { error: true, msg: `Task ${id} is completed, cannot start` };
          it.inProgress = !it.inProgress;
          (it.inProgress ? started : paused).push(id);
        }
        this._save();
        let msg = '';
        if (started.length) msg += `Started: ${started.join(', ')}. `;
        if (paused.length) msg += `Paused: ${paused.join(', ')}.`;
        return { success: true, msg };
      }

      starItems(idsRaw) {
        let ids = idsRaw.map(String);
        let v = this._validateIds(ids);
        if (v.error) return v;
        let starred = [], unstarred = [];
        for (let id of v.valid) {
          this.items[id].isStarred = !this.items[id].isStarred;
          (this.items[id].isStarred ? starred : unstarred).push(id);
        }
        this._save();
        let msg = '';
        if (starred.length) msg += `Starred: ${starred.join(', ')}. `;
        if (unstarred.length) msg += `Unstarred: ${unstarred.join(', ')}.`;
        return { success: true, msg };
      }

      deleteItems(idsRaw) {
        let ids = idsRaw.map(String);
        let v = this._validateIds(ids);
        if (v.error) return v;
        let moved = [];

        // Function to collect all descendants
        function getAllDescendants(itemId, allItems) {
          let descendants = [];
          for (let [id, item] of Object.entries(allItems)) {
            if (item.parentId === itemId) {
              descendants.push(Number(id));
              descendants.push(...getAllDescendants(Number(id), allItems));
            }
          }
          return descendants;
        }

        // Collect all IDs to delete (parents + all descendants)
        let idsToDelete = new Set();
        for (let id of v.valid) {
          if (!this.items[id]) continue; // already deleted as descendant
          idsToDelete.add(id);
          let descendants = getAllDescendants(id, this.items);
          for (let d of descendants) idsToDelete.add(d);
        }

        // Archive and delete
        for (let id of idsToDelete) {
          let item = this.items[id];
          if (!item) continue;
          let archiveId = this._nextArchiveId();
          this.archive[archiveId] = JSON.parse(JSON.stringify(item));
          delete this.items[id];
          moved.push(id);
        }

        this._save();
        return { success: true, msg: `Deleted and archived: ${Array.from(moved).join(', ')}` };
      }
      _nextArchiveId() {
        let ids = Object.keys(this.archive).map(Number);
        let max = ids.length ? Math.max(...ids) : 0;
        return max + 1;
      }

      restoreItems(idsRaw) {
        let ids = idsRaw.map(String);
        let v = this._validateIds(ids, 'archive');
        if (v.error) return v;

        let map = {}, restores = [];
        for (let oldId of v.valid) {
          let archived = this.archive[oldId];
          if (!archived) continue;
          let newId = this._generateId();
          restores.push({ newId, oldId, item: { ...archived, id: newId } });
          map[oldId] = newId;
          delete this.archive[oldId];
        }

        for (let { newId, item } of restores) {
          if (item.parentId) {
            let p = item.parentId;
            if (map[p]) item.parentId = map[p];
            else if (!this.items[p]) delete item.parentId;
            // else keep original parentId (still active)
          }
          this.items[newId] = item;
        }

        this._save();
        return { success: true, msg: `Restored: ${restores.map(r => `${r.oldId}->${r.newId}`).join(', ')}` };
      }

      editItem(idRaw, newDesc) {
        let id = Number(idRaw);
        if (!this.items[id]) return { error: true, msg: `ID ${id} not found` };
        if (!newDesc || !newDesc.trim()) return { error: true, msg: 'Description required' };
        this.items[id].description = newDesc.trim();
        this._save();
        return { success: true, msg: `Updated item ${id}: "${newDesc.trim()}"` };
      }

      moveBoards(idRaw, targetBoards) {
        let id = Number(idRaw);
        if (!this.items[id]) return { error: true, msg: `ID ${id} not found` };

        let boards = [];
        for (let b of targetBoards) {
          let clean = b.toLowerCase().replace(/[^a-z0-9_-]/g, '');
          if (clean === 'inbox') boards.push('inbox');
          else if (clean) boards.push('@' + clean);
        }
        if (!boards.length) boards.push('inbox');

        delete this.items[id].parentId; // 🔗 Unlink if it was a subtask!
        this.items[id].boards = [...new Set(boards)];
        this._save();
        return { success: true, msg: `Moved [${id}] to boards: ${boards.join(', ')} (Unlinked)` };
      }



      // --- SUBTASK & HIERARCHY LOGIC --------------------------------

      _wouldCreateCycle(currentId, targetParentId) {
        let parent = this.items[targetParentId];
        while (parent) {
          if (parent.id === currentId) return true;
          parent = parent.parentId ? this.items[parent.parentId] : null;
        }
        return false;
      }

      getLocation(idRaw) {
        let id = Number(idRaw);
        if (!this.items[id]) return { error: true, msg: `ID ${id} not found` };

        let item = this.items[id];
        let location = item.parentId ? `a subtask of @${item.parentId}` : `on board(s): ${item.boards.join(', ')}`;
        return { success: true, msg: `Item [${id}] is currently ${location}` };
      }

      createSubtask(parentIdRaw, args) {
        let parentId = Number(parentIdRaw);
        if (!this.items[parentId]) return { error: true, msg: `Parent ID ${parentId} not found` };

        // 1. Create the task (Parser now handles flags anywhere)
        let result = this.createTask(args);
        if (result.error) return result;

        let newId = result.id;

        // 2. Cycle detection
        if (this._wouldCreateCycle(newId, parentId)) {
          delete this.items[newId];
          this._save();
          return { error: true, msg: `Cannot create subtask - would create circular reference` };
        }

        // 3. Link and save
        this.items[newId].parentId = parentId;
        this._save();
        return { success: true, msg: `Created subtask [${newId}] linked to parent [${parentId}]` };
      }

      reparentTask(subtaskIdRaw, newParentIdRaw) {
        let subtaskId = Number(subtaskIdRaw);
        let newParentId = Number(newParentIdRaw);

        if (!this.items[subtaskId]) return { error: true, msg: `Subtask ID ${subtaskId} not found` };
        if (!this.items[newParentId]) return { error: true, msg: `Parent ID ${newParentId} not found` };
        if (subtaskId === newParentId) return { error: true, msg: `Cannot nest an item under itself` };

        if (this._wouldCreateCycle(subtaskId, newParentId)) {
          return { error: true, msg: `Cannot reparent - would create circular reference` };
        }

        this.items[subtaskId].parentId = newParentId;
        this._save();
        return { success: true, msg: `Nested [${subtaskId}] under [${newParentId}]` };
      }

      updatePriority(idRaw, levelRaw) {
        let id = Number(idRaw);
        let level = Number(levelRaw);
        if (!this.items[id]) return { error: true, msg: `ID ${id} not found` };
        if (![1, 2, 3].includes(level)) return { error: true, msg: 'Priority must be 1,2,3' };
        if (!this.items[id]._isTask) return { error: true, msg: 'Only tasks have priority' };
        this.items[id].priority = level;
        this._save();
        let prio = level === 3 ? 'HIGH' : (level === 2 ? 'MEDIUM' : 'NORMAL');
        return { success: true, msg: `Priority of task ${id} set to ${prio}` };
      }

      updateDue(idRaw, dueDateRaw) {
        let id = Number(idRaw);
        if (!this.items[id]) return { error: true, msg: `ID ${id} not found` };
        if (!this.items[id]._isTask) return { error: true, msg: 'Only tasks can have due dates' };

        if (dueDateRaw !== 'none' && !/^\d{2}-\d{2}-\d{4}$/.test(dueDateRaw)) {
          return { error: true, msg: 'Due date must be DD-MM-YYYY (or "none" to remove)' };
        }

        this.items[id]._dueDate = dueDateRaw === 'none' ? null : dueDateRaw;
        this._save();
        return { success: true, msg: `Due date for task ${id} set to ${this.items[id]._dueDate || 'none'}` };
      }

      clearCompleted() {
        let toDelete = [];
        for (let [id, it] of Object.entries(this.items)) {
          if (it._isTask && it.isComplete) toDelete.push(Number(id));
        }
        if (!toDelete.length) return { success: true, msg: 'No completed tasks to clear' };
        return this.deleteItems(toDelete);
      }

      getBoardView() {
        let groups = this._groupByBoard();
        let lines = [];
        let stats = this._computeStats();

        for (let [board, items] of Object.entries(groups)) {
          if (items.length === 0) continue;
          let taskCount = items.filter(i => i._isTask).length;
          let completeCount = items.filter(i => i._isTask && i.isComplete).length;

          let boardName = board === 'inbox' ? '@inbox' : board;
          boardName = escapeHtml(boardName);   // FIX XSS
          lines.push(`\n<span class="board-header">${boardName}</span> <span class="c-dim">[${completeCount}/${taskCount}]</span>`);

          for (let it of items) {
            lines.push(this._formatItemLine(it));
          }
        }

        lines.push(`\n<span class="c-dim">${stats.percent}% of all tasks complete.</span>`);
        lines.push(`<span class="c-green">${stats.complete}</span> <span class="c-dim">done ·</span> <span class="c-purple">${stats.pending}</span> <span class="c-dim">pending ·</span> <span class="c-blue">${stats.notes}</span> <span class="c-dim">notes</span>`);

        return lines.join('\n');
      }

      getTimelineView() {
        let groups = this._groupByDate();
        let lines = ['TIMELINE (by creation date)'];
        for (let [date, items] of Object.entries(groups).sort((a, b) => new Date(a[0]) - new Date(b[0]))) {
          lines.push(`\n${date}`);
          for (let it of items) lines.push(this._formatItemLine(it));
        }
        return lines.join('\n');
      }

      getArchiveView() {
        if (Object.keys(this.archive).length === 0) return 'Archive is empty.';
        let lines = ['ARCHIVED ITEMS'];
        for (let [id, item] of Object.entries(this.archive)) {
          let type = item._isTask ? (item.isComplete ? '[done]' : '[task]') : '[note]';
          let desc = escapeHtml(item.description);
          let boards = item.boards ? escapeHtml(item.boards.join(',')) : '';
          lines.push(` ${id}. ${type} ${desc}  ${boards}`);
        }
        return lines.join('\n');
      }

      findItems(terms) {
        let lower = terms.map(t => t.toLowerCase());
        let result = {};
        for (let [id, it] of Object.entries(this.items)) {
          if (lower.some(term => it.description.toLowerCase().includes(term))) result[id] = it;
        }
        return result;
      }

      filterByAttributes(attrList) {
        let filtered = { ...this.items };
        for (let a of attrList) {
          let low = a.toLowerCase();
          if (['star', 'starred'].includes(low)) filtered = Object.fromEntries(Object.entries(filtered).filter(([_, v]) => v.isStarred));
          else if (['done', 'complete', 'checked'].includes(low)) filtered = Object.fromEntries(Object.entries(filtered).filter(([_, v]) => v._isTask && v.isComplete));
          else if (['progress', 'started'].includes(low)) filtered = Object.fromEntries(Object.entries(filtered).filter(([_, v]) => v._isTask && v.inProgress && !v.isComplete));
          else if (['pending', 'unchecked'].includes(low)) filtered = Object.fromEntries(Object.entries(filtered).filter(([_, v]) => v._isTask && !v.isComplete && !v.inProgress));
          else if (['task', 'tasks'].includes(low)) filtered = Object.fromEntries(Object.entries(filtered).filter(([_, v]) => v._isTask));
          else if (['note', 'notes'].includes(low)) filtered = Object.fromEntries(Object.entries(filtered).filter(([_, v]) => !v._isTask));
        }
        return filtered;
      }

      listByAttributesAndBoards(flags, boards) {
        let filtered = this.filterByAttributes(flags);
        if (boards.length) {
          let boardSet = new Set(boards.map(b => b === 'inbox' ? 'inbox' : (b.startsWith('@') ? b : '@' + b)));
          filtered = Object.fromEntries(Object.entries(filtered).filter(([_, v]) => v.boards.some(b => boardSet.has(b))));
        }
        return filtered;
      }

      _formatItemLine(item, indent = 0, parentBoards = null) {
        let star = item.isStarred ? '<span class="c-yellow">★</span>' : '';
        let prefix = '';
        let desc = escapeHtml(item.description);   // FIX XSS

        // Inherit boards from parent for display purposes
        let displayBoards = parentBoards || item.boards;

        if (item._isTask) {
          if (item.isComplete) {
            prefix = '<span class="c-green">✓</span>';
            desc = `<span class="c-dim">${desc}</span>`;
          } else if (item.inProgress) {
            prefix = '<span class="c-blue">•</span>';
          } else {
            prefix = '<span class="c-purple">☐</span>';
          }
        } else {
          prefix = '<span class="c-blue">•</span>';
          desc = `<span class="c-dim">${desc}</span>`;
        }

        let prio = '';
        if (item._isTask && !item.isComplete && item.priority === 3) {
          desc = `<span class="c-yellow" style="text-decoration: underline">${desc}</span>`;
          prio = ' <span class="c-yellow">(!)</span>';
        }
        else if (item._isTask && !item.isComplete && item.priority === 2) {
          prio = ' <span class="c-yellow">(!)</span>';
        }

        let dueStr = '';
        if (item._isTask && item._dueDate && !item.isComplete) {
          let dueDateEscaped = escapeHtml(item._dueDate);   // FIX XSS
          let [d, m, y] = item._dueDate.split('-');
          let dueTime = new Date(y, m - 1, d, 23, 59, 59).getTime();
          let isOverdue = Date.now() > dueTime;
          dueStr = isOverdue ? ` <span class="c-red">[due: ${dueDateEscaped}]</span>` : ` <span class="c-dim">[due: ${dueDateEscaped}]</span>`;
        }

        let age = this._getAge(item._timestamp);
        let ageStr = age ? ` <span class="c-dim">${age}d</span>` : '';

        let spacing = ' '.repeat(indent === 0 ? 2 : indent);
        let mainLine = `${spacing}<span class="c-dim">${item.id}.</span> ${prefix} ${desc}${prio}${dueStr}${ageStr} ${star}`.trimEnd();

        // Recursively render children (they inherit parent's boards)
        let children = Object.values(this.items).filter(c => c.parentId === item.id);
        if (children.length > 0) {
          for (let child of children.sort((a, b) => a.id - b.id)) {
            mainLine += '\n' + this._formatItemLine(child, indent === 0 ? 6 : indent + 4, displayBoards);
          }
        }

        return mainLine;
      }
      _getAge(ts) {
        let days = Math.floor((Date.now() - ts) / 86400000);
        if (days === 0) return '';
        return days;
      }

      _groupByBoard() {
        let boardsSet = new Set(['inbox']);
        Object.values(this.items).forEach(it => it.boards.forEach(b => boardsSet.add(b)));
        let groups = {};
        for (let b of boardsSet) groups[b] = [];
        Object.values(this.items).forEach(it => {
          if (it.parentId) return; // 🛑 ADD THIS LINE: Skip subtasks at the root level
          it.boards.forEach(b => { if (groups[b]) groups[b].push(it); });
        });
        for (let b in groups) groups[b].sort((a, b) => a.id - b.id);
        return groups;
      }

      _groupByDate() {
        let groups = {};
        Object.values(this.items).forEach(it => {
          if (it.parentId) return; // 🛑 ADD THIS LINE: Skip subtasks at the root level
          let d = it._date;
          if (!groups[d]) groups[d] = [];
          groups[d].push(it);
        });
        for (let d in groups) groups[d].sort((a, b) => a.id - b.id);
        return groups;
      }

      _computeStats() {
        let complete = 0, inProgress = 0, pending = 0, notes = 0;
        Object.values(this.items).forEach(it => {
          if (it._isTask) {
            if (it.isComplete) complete++;
            else if (it.inProgress) inProgress++;
            else pending++;
          } else notes++;
        });
        let total = complete + inProgress + pending;
        let percent = total === 0 ? 0 : Math.floor(complete * 100 / total);
        return { percent, complete, inProgress, pending, notes };
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function (m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    // ------------------------- TERMINAL UI -------------------------
    const tb = new Core();
    const outputDiv = document.getElementById('output');
    const cmdInput = document.getElementById('cmd-input');

    function renderPlainText(text) {
      let div = document.createElement('div');
      div.className = 'response-text';
      div.innerHTML = text;   // trust the HTML – it's built safely
      return div;
    }

    function addUserCommand(cmd) {
      let userDiv = document.createElement('div');
      userDiv.className = 'user-cmd-line';
      userDiv.innerText = `$ ${cmd}`;
      outputDiv.appendChild(userDiv);
    }

    function addResponse(msg) {
      let resp = renderPlainText(msg);
      outputDiv.appendChild(resp);
      outputDiv.scrollTop = outputDiv.scrollHeight;
    }



    const HELP_MENU = `task / -t / add description @board p:2                 : create task
note / -n description @board                           : create note
sub / subtask @id description                          : create subtask under parent
list / ls / -l [@board] [flags]                        : list items (flags: star,done,progress,pending,task,note)
board                                                  : dashboard view
timeline / -i                                          : timeline by creation date
archive / -a                                           : show archived items
check / -c [id1 id2 ...]                               : toggle complete
begin / -b [id1 id2 ...]                               : start/pause task
star / -s [id1 id2 ...]                                : toggle starred
delete / -d [id1 id2 ...]                              : delete & archive
sweep                                                  : remove all completed tasks
edit / -e @id new description                          : change description
move / mv / -m @id @parent_id                          : nest under another task
move / mv / -m @id @board1 @board2 ...                 : move to board(s) (unlinks)
priority / -p @id 1|2|3                                : set priority (1 normal, 3 high)
due @id DD-MM-YYYY | none                              : set or remove due date
find / -f keyword                                      : search descriptions
restore / -r [id1 id2 ...]                             : restore from archive
help / -h / --help                                     : show this menu`;


    async function handleCommand(raw) {
      if (!raw.trim()) {
        addResponse(tb.getBoardView());
        return;
      }
      let args = raw.trim().split(/\s+/);
      let main = args[0];
      if (main === 'help' || main === '-h' || main === '--help') {
        addResponse(HELP_MENU);
        return;
      }
      if (main === 'board' || main === '') {
        addResponse(tb.getBoardView());
        return;
      }
      if (main === 'task' || main === '-t' || main === 'add') {
        let res = tb.createTask(args.slice(1));
        addResponse(res.error ? `Error: ${res.msg}` : res.msg);
        return;
      }
      if (main === 'note' || main === '-n') {
        let res = tb.createNote(args.slice(1));
        addResponse(res.error ? `Error: ${res.msg}` : res.msg);
        return;
      }
      if (main === 'list' || main === '-l' || main === 'ls') {
        let flags = [], boards = [];
        for (let i = 1; i < args.length; i++) {
          let tok = args[i];
          if (tok.startsWith('@') || tok.toLowerCase() === 'inbox') boards.push(tok);
          else flags.push(tok);
        }
        let filtered = tb.listByAttributesAndBoards(flags, boards);
        if (Object.keys(filtered).length === 0) addResponse('No items match.');
        else {
          let lines = [];
          // Show only root items (no parentId) – children will be rendered recursively
          let rootItems = Object.values(filtered).filter(it => !it.parentId);
          for (let it of rootItems.sort((a, b) => a.id - b.id)) {
            lines.push(tb._formatItemLine(it));
          }
          addResponse(lines.join('\n'));
        }
        return;
      }
      if (main === 'check' || main === '-c') {
        if (args.length < 2) { addResponse('Usage: check id1 id2 ...'); return; }
        let res = tb.checkTasks(args.slice(1));
        addResponse(res.error ? `Error: ${res.msg}` : res.msg);
        return;
      }
      if (main === 'begin' || main === '-b') {
        if (args.length < 2) { addResponse('Usage: begin ids'); return; }
        let res = tb.beginTasks(args.slice(1));
        addResponse(res.error ? `Error: ${res.msg}` : res.msg);
        return;
      }
      if (main === 'star' || main === '-s') {
        if (args.length < 2) { addResponse('Usage: star ids'); return; }
        let res = tb.starItems(args.slice(1));
        addResponse(res.error ? `Error: ${res.msg}` : res.msg);
        return;
      }
      if (main === 'delete' || main === '-d') {
        if (args.length < 2) { addResponse('Usage: delete ids'); return; }
        let res = tb.deleteItems(args.slice(1));
        addResponse(res.error ? `Error: ${res.msg}` : res.msg);
        return;
      }
      if (main === 'sweep') {
        let res = tb.clearCompleted();
        addResponse(res.msg);
        return;
      }
      if (main === 'edit' || main === '-e') {
        let idFlag = args[1];
        if (!idFlag || !idFlag.startsWith('@')) { addResponse('edit @id new description'); return; }
        let idNum = idFlag.slice(1);
        let newDesc = args.slice(2).join(' ');
        let res = tb.editItem(idNum, newDesc);
        addResponse(res.error ? `Error: ${res.msg}` : res.msg);
        return;
      }

      if (main === 'move' || main === 'mv' || main === 'm') {
        let idFlag = args[1];
        let targetFlag = args[2];

        if (!idFlag || !idFlag.startsWith('@')) {
          addResponse('Usage: mv @id @parent_id OR mv @id board1 board2 (unlinks)');
          return;
        }

        let id = idFlag.slice(1);

        // Scenario A: Query current location
        if (!targetFlag) {
          let res = tb.getLocation(id);
          addResponse(res.error ? `Error: ${res.msg}` : res.msg);
          return;
        }

        // 🧠 SMART CHECK (Regex Edition): Is it strictly @ followed by only digits?
        let isParentId = targetFlag.startsWith('@') &&
          targetFlag.length > 1 &&
          /^\d+$/.test(targetFlag.slice(1));

        // Scenario B: Nesting under a parent (Reparent)
        if (isParentId) {
          let res = tb.reparentTask(id, targetFlag.slice(1));
          addResponse(res.error ? `Error: ${res.msg}` : res.msg);
        }
        // Scenario C: Moving to boards (Unlink & Multi-Tag)
        else {
          let res = tb.moveBoards(id, [targetFlag, ...args.slice(3)]);
          addResponse(res.error ? `Error: ${res.msg}` : res.msg);
        }
        return;
      }

      if (main === 'sub' || main === 'subtask') {
        let idFlag = args[1];
        if (!idFlag || !idFlag.startsWith('@')) {
          addResponse('Usage: sub @id [options] description');
          return;
        }

        let res = tb.createSubtask(idFlag.slice(1), args.slice(2));
        addResponse(res.error ? `Error: ${res.msg}` : res.msg);
        return;
      }


      if (main === 'priority' || main === '-p') {
        let idFlag = args[1];
        let level = args[2];
        if (!idFlag || !idFlag.startsWith('@') || !level) { addResponse('priority @id 1|2|3'); return; }
        let res = tb.updatePriority(idFlag.slice(1), level);
        addResponse(res.error ? `Error: ${res.msg}` : res.msg);
        return;
      }
      if (main === 'due') {
        let idFlag = args[1];
        let dueDate = args[2];
        if (!idFlag || !idFlag.startsWith('@') || !dueDate) {
          addResponse('Usage: due @id DD-MM-YYYY (or "none" to remove)');
          return;
        }
        let res = tb.updateDue(idFlag.slice(1), dueDate);
        addResponse(res.error ? `Error: ${res.msg}` : res.msg);
        return;
      }
      if (main === 'archive' || main === '-a') {
        addResponse(tb.getArchiveView());
        return;
      }
      if (main === 'restore' || main === '-r') {
        if (args.length < 2) { addResponse('restore ids'); return; }
        let res = tb.restoreItems(args.slice(1));
        addResponse(res.error ? `Error: ${res.msg}` : res.msg);
        return;
      }
      if (main === 'timeline' || main === '-i') {
        addResponse(tb.getTimelineView());
        return;
      }
      if (main === 'find' || main === '-f') {
        if (args.length < 2) { addResponse('find keyword'); return; }
        let matches = tb.findItems(args.slice(1));
        if (Object.keys(matches).length === 0) addResponse('No matches.');
        else {
          let lines = [];
          for (let it of Object.values(matches).sort((a, b) => a.id - b.id)) lines.push(tb._formatItemLine(it));
          addResponse(lines.join('\n'));
        }
        return;
      }

      // fallback -> board view
      let safeMain = main.replace(/</g, "&lt;").replace(/>/g, "&gt;");
      addResponse(`Command not recognized: "${escapeHtml(safeMain)}"\n\n${HELP_MENU}`);
    }

    let cmdHistory = [];
    let historyPos = 0;
    let isNavigating = false;
    const MAX_HISTORY = 100;

    function addToHistory(cmd) {
      if (!cmd.trim()) return;
      if (cmdHistory[cmdHistory.length - 1] === cmd) return;
      cmdHistory.push(cmd);
      if (cmdHistory.length > MAX_HISTORY) cmdHistory.shift();
    }

    // Reset navigation position when user manually edits input
    cmdInput.addEventListener('input', () => {
      if (!isNavigating) {
        historyPos = cmdHistory.length;
      }
    });

    cmdInput.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        let raw = cmdInput.value.trim();
        // Reset navigation flag
        isNavigating = false;

        outputDiv.innerHTML = '';
        if (raw) {
          addUserCommand(raw);
          addToHistory(raw);
          historyPos = cmdHistory.length;
        }
        cmdInput.value = '';
        await handleCommand(raw);
        outputDiv.scrollTop = outputDiv.scrollHeight;
      }
      else if (e.key === 'ArrowUp') {
        e.preventDefault();
        isNavigating = true;
        if (historyPos > 0) {
          historyPos--;
          cmdInput.value = cmdHistory[historyPos];
        }
      }
      else if (e.key === 'ArrowDown') {
        e.preventDefault();
        isNavigating = true;
        if (historyPos < cmdHistory.length) {
          historyPos++;
          cmdInput.value = historyPos === cmdHistory.length ? '' : cmdHistory[historyPos];
        } else {
          // Already at bottom, clear input
          cmdInput.value = '';
        }
      }
      else {
        // Any other key resets navigation flag after a short delay
        // (so typing after navigation resets position)
        setTimeout(() => { isNavigating = false; }, 0);
      }
    });
    function init() {
      addResponse(tb.getBoardView());
      cmdInput.focus();
      document.getElementById('terminal').addEventListener('click', () => cmdInput.focus());
    }
    init();
  </script>
